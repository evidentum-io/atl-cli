[package]
name = "atl-cli"
version = "0.11.0"
edition = "2021"
rust-version = "1.92.0"
license = "Apache-2.0"
description = "CLI tool for verifying ATL Protocol receipts against source files"
repository = "https://github.com/evidentum/atl-cli"
keywords = ["transparency-log", "verification", "cli", "merkle-tree"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "atl-cli"
path = "src/main.rs"

[[bin]]
name = "generate_test_data"
path = "test_data/fixtures/generate_test_data.rs"

[dependencies]
# Core - always required (with online features)
atl-core = { version = "0.30", features = ["rfc3161-verify", "bitcoin-ots"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
# Constant-time comparison of block-header hashes reported by the
# block-explorer APIs (src/verify/anchor.rs, src/net/bitcoin.rs). Anchor
# `target_hash` pinning is `atl-core`'s, and uses the same crate there.
subtle = "2"
# Parsing caller-supplied PEM/DER certificates for `--tsa-trust-store`
# (src/verify/trust_store.rs). Pinned to the same "0.2" line atl-core itself
# depends on so `x509_cert::Certificate` is the same type on both sides of
# the `atl_core::TrustStore::with_anchor_certificate` API.
x509-cert = "0.2"
der = "0.7"

# File hashing
sha2 = "0.10"

# Output formatting
colored = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Online verification (optional)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
futures = { version = "0.3", optional = true }
once_cell = { version = "1", optional = true }

[dev-dependencies]
# Only to build the synthetic multi-attestation OTS proof in
# `verify::anchor`'s tests: real Evidentum proofs carry a single Bitcoin
# attestation, so the "claim matches any attestation" rule (ATL v2.0 §5.5.2
# step 5) has no production fixture to exercise it. Same major line as the
# one `atl-core` decodes with.
base64 = "0.22"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
default = ["online"]
online = ["reqwest", "tokio", "futures", "once_cell"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
